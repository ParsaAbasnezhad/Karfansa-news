# The host TLS reverse proxy is the only supported production ingress. It must
# overwrite X-Forwarded-Proto and X-Forwarded-For before forwarding to the
# loopback-only Compose port. Nginx accepts only a literal "https" protocol.
map $http_x_forwarded_proto $forwarded_proto {
  default http;
  https https;
}

map $http_x_real_ip $client_real_ip {
  "" $remote_addr;
  default $http_x_real_ip;
}

# Valid client-side routes are explicit so unknown URLs return a real HTTP 404.
# Keep this map aligned with the React route table.
map $uri $spa_route {
  default 0;
  ~^/$ 1;
  ~^/(news|editorial|login|register|verify|forgot-password|reset-password|account|about|contact|status)/?$ 1;
  ~^/account/security/?$ 1;
  ~^/news/[^/]+/?$ 1;
  ~^/editorial/[^/]+/?$ 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'" always;

  error_page 404 /404.html;
  error_page 500 502 503 504 /500.html;

  location = /404.html { internal; }
  location = /500.html { internal; }

  location /api/ {
    error_page 502 503 504 = @api_unavailable;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
  }

  location @api_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; form-action 'self'" always;
    return 503 '{"error":{"code":"service_unavailable","message":"Service temporarily unavailable."}}';
  }

  location = /admin { return 308 /admin/; }
  location /admin/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
  }

  location = /sitemap.xml {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  location /static/ {
    alias /app/staticfiles/;
    expires 7d;
  }

  # Editorial uploads are images. Never render an uploaded active document.
  location ~* ^/media/.*\.(?:html?|svg|js|css)$ { return 403; }
  location /media/ {
    alias /app/media/;
    expires 7d;
  }

  location / {
    try_files $uri @spa;
  }

  location @spa {
    if ($spa_route = 0) { return 404; }
    try_files /index.html =404;
  }
}
