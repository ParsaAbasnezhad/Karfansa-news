name: karfansa-news

x-backend: &backend
  build:
    context: ./backend
    target: development
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Always use the Compose service hostname inside the network (host .env may say localhost).
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
  volumes:
    - ./backend:/app
    - media_data:/app/media
  networks: [internal]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    <<: *backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    stop_grace_period: 10s

  celery_worker:
    <<: *backend
    restart: unless-stopped
    command: celery -A config worker -l info
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s

  celery_beat:
    <<: *backend
    restart: unless-stopped
    command: celery -A config beat -l info
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - media_data:/app/media:ro
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    networks: [internal]

networks:
  internal:
    name: karfansa_news_internal

volumes:
  postgres_data:
    name: karfansa_news_postgres_data
  redis_data:
    name: karfansa_news_redis_data
  media_data:
    name: karfansa_news_media_data
  frontend_node_modules:
    name: karfansa_news_frontend_node_modules
