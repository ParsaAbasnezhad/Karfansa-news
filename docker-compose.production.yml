name: karfansa-news-production

x-backend: &backend
  build:
    context: ./backend
    target: production
  env_file: .env.production
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  volumes:
    - media_data:/app/media
    - static_data:/app/staticfiles
  networks: [data, web]
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  stop_grace_period: 45s

services:
  db:
    image: postgres:16.16-alpine3.24
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

  redis:
    image: redis:7.4.12-alpine3.22
    restart: unless-stopped
    env_file: .env.production
    command:
      ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}), timeout=4)"
      interval: 15s
      timeout: 6s
      start_period: 45s
      retries: 4

  celery_worker:
    <<: *backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    networks: [data]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 45s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 90s

  celery_beat:
    <<: *backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    networks: [data]
    depends_on:
      backend: {condition: service_healthy}
    stop_grace_period: 45s

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:8080"
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    networks: [web]
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    stop_grace_period: 30s

networks:
  data:
  web:

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
