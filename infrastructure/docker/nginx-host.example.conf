# Example host TLS ingress for docker-compose.production.yml.
# Replace the hostname and certificate paths. Install in the host Nginx http
# context; do not publish the Compose frontend port to a public interface.
# If another trusted proxy/CDN sits in front, configure its verified real-IP
# ranges at this layer before using $remote_addr for auth rate limiting.
server {
    listen 80;
    server_name REPLACE_WITH_PUBLIC_HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name REPLACE_WITH_PUBLIC_HOSTNAME;
    ssl_certificate REPLACE_WITH_CERTIFICATE_PATH;
    ssl_certificate_key REPLACE_WITH_PRIVATE_KEY_PATH;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
    }
}
